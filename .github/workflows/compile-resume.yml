name: Compile Resume

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Lakshit_Verma_Resume.typ'
      - 'fonts-cm/**'
      - 'build.sh'
      - '.github/workflows/compile-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Compile Resume
        env:
          TZ: "Asia/Kolkata"
        run: |
          mkdir -p docs
          ./build.sh docs/Lakshit_Verma_Resume.pdf

      - name: Generate high-res thumbnail
        run: |
          typst compile --font-path fonts-cm --format png --ppi 300 Lakshit_Verma_Resume.typ docs/og-thumbnail.png

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update compiled resume PDF and thumbnail"
          file_pattern: "docs/Lakshit_Verma_Resume.pdf docs/og-thumbnail.png"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs: update compiled resume PDF and thumbnail"
