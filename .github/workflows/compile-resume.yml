name: Compile Resume

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Lakshit_Verma_Resume.typ'
      - 'fonts-cm/**'
      - 'build.sh'
      - '.github/workflows/compile-resume.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Compile Resume
        env:
          TZ: "Asia/Kolkata"
        run: |
          mkdir -p docs
          ./build.sh docs/Lakshit_Verma_Resume.pdf

      - name: Generate high-res thumbnail
        run: |
          pdftoppm -png -r 300 -singlefile docs/Lakshit_Verma_Resume.pdf docs/og-thumbnail

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update compiled resume PDF and thumbnail"
          file_pattern: "docs/Lakshit_Verma_Resume.pdf docs/og-thumbnail.png"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
